name: myenv
channels:
  - conda-forge    # Provides python_abi and torchvision builds
  - pytorch        # Official PyTorch packages
  - nvidia         # CUDA metapackages
  # - defaults

dependencies:
  - python=3.11
  - pip
  - fasttext

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.3.0+cu118
      - torchvision==0.18.0+cu118
      - xformers==0.0.26.post1+cu118
      - torchaudio==2.3.0+cu118
      - pytorch-ignite==0.4.13
      - onnxscript
      - transformers==4.32.1
      - diffusers==0.26.3
      - accelerate==0.23.0
      - pytorch-ignite==0.4.13
      - albucore==0.0.13
      - ml-collections==0.1.1
      - absl-py==2.1.0 
      - pandas==2.0.1
      - nltk==3.6.7
      - albumentations==1.4.14
      - albucore==0.0.13
      - lmdb==1.2.1
      - timm==0.9.16
      # - fastText==0.9.2
      - wandb==0.19.10
      - ultralytics==8.3.161