feeder: dataset.dataloader_video.BaseFeeder
phase: test
dataset: captar-libras_10-12
work_dir: ./work_dir/inferences/eval_inference

num_epoch: 111
batch_size: 2
random_seed: 0
test_batch_size: 1
num_worker: 0
device: 0
log_interval: 50
eval_interval: 1
save_interval: 1
# python in default
#evaluate_tool: sclite
evaluate_tool: python
loss_weights:
  SeqCTC: 1.0
  # VAC
  # ConvCTC: 1.0
  # Dist: 10.0
#load_weights: ''

optimizer_args:
  optimizer: Adam
  base_lr: 0.0001
  step: [ 40, 65, 85, 95, 100]
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: False

feeder_args:
  mode: 'train'
  datatype: 'video'
  num_gloss: -1
  drop_ratio: 1.0

model: slr_network.SLRModel
decode_mode: beam
model_args:
  num_classes: 1296
  c2d_type: resnet18
  conv_type: 2
  use_bn: 1
  # SMKD
  share_classifier: True
  weight_norm: True
  
  # ResNet Memory Efficient
  custom_resnet: False 
  half_it: True
  chunks: 1
  memory_debug: False
