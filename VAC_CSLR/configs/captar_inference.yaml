feeder: dataset.system-dataloader_video_inference.BaseFeeder
phase: test
dataset: captar-libras_10-12
num_epoch: 40
work_dir: ./work_dir/inferences/captar_inference
batch_size: 2 
random_seed: 0
test_batch_size: 1 
num_worker: 0
device: 0
log_interval: 50
eval_interval: 1
save_interval: 5
evaluate_tool: python
loss_weights:
  SeqCTC: 1.0
  # VAC
  # ConvCTC: 1.0
  # Dist: 10.0
#load_weights: ''

optimizer_args:
  optimizer: Adam
  base_lr: 0.0001
  step: [ 20, 35]
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: False

model: slr_network.SLRModel
decode_mode: beam
model_args:
  num_classes: 1296
  c2d_type: resnet18
  conv_type: 2
  use_bn: 1
  # SMKD
  share_classifier: True
  weight_norm: True

  # ResNet Memory Efficient
  custom_resnet: False
  half_it: True
  chunks: 1
  memory_debug: True

feeder_args: 
  transform_mode: 'yolo_hf'

