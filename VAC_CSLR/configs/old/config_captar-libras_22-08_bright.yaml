feeder: dataset.dataloader_bright_individual_normalize_int_npz.BaseFeeder
phase: train
dataset: captar-libras_22-08

num_epoch: 151
work_dir: ./work_dir/captar-libras_22-08_ext_int_npz/
batch_size: 2
# grad_accumulation_steps: Number of batches for which gradients are accumulated before performing a weights update.
grad_accumulation_steps: 2
random_seed: 0
test_batch_size: 1
num_worker: 16
device: 0
log_interval: 50
eval_interval: 1
save_interval: 5
# python in default
#evaluate_tool: sclite
evaluate_tool: python
loss_weights:
  SeqCTC: 1.0
  # VAC
  # ConvCTC: 1.0
  # Dist: 10.0
load_weights: './work_dir/captar-libras_22-08_general_normalize_int_npz/dev_11.22_epoch80_model.pt'

optimizer_args:
  optimizer: Adam
  base_lr: 0.0001
  step: [ 40, 65, 85, 95, 100, 130, 140]
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 81
  nesterov: False

feeder_args:
  mode: 'train'
  datatype: 'video'
  num_gloss: -1
  drop_ratio: 1.0

model: slr_network.SLRModel
decode_mode: beam
model_args:
  num_classes: 1296
  c2d_type: resnet18
  conv_type: 2
  use_bn: 1
  # SMKD
  share_classifier: True
  weight_norm: True
